<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Tracker</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Time Tracker</h1>
    <p>Учёт времени сотрудников · без авторизации · демо-данные</p>
  </header>

  <main>
    <div class="grid-2">
      <section class="card">
        <h2>Сотрудники</h2>
        <div class="row">
          <div>
            <label for="emp-name">Имя</label>
            <input id="emp-name" placeholder="Имя сотрудника" />
          </div>
          <div>
            <label for="emp-title">Должность (необяз.)</label>
            <input id="emp-title" placeholder="Должность" />
          </div>
        </div>
        <button id="btn-add-emp" type="button">Добавить</button>
        <p id="emp-msg" class="msg"></p>
        <div style="overflow-x:auto; margin-top:0.75rem">
          <table>
            <thead>
              <tr><th>Имя</th><th>Должность</th><th></th></tr>
            </thead>
            <tbody id="emp-table"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Таймер</h2>
        <label for="timer-emp">Сотрудник</label>
        <select id="timer-emp"></select>
        <label for="timer-desc">Задача (до 500 символов)</label>
        <textarea id="timer-desc" maxlength="500" placeholder="Что делаем?"></textarea>
        <div class="row">
          <button id="btn-start" type="button">Старт</button>
          <button id="btn-stop" type="button" class="secondary">Стоп</button>
        </div>
        <p id="timer-msg" class="msg"></p>
        <h2 style="margin-top:1rem">Активные</h2>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>Сотрудник</th><th>Задача</th><th>Старт</th></tr>
            </thead>
            <tbody id="active-table"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>Отчёт за период</h2>
      <div class="row">
        <div>
          <label for="rep-from">С</label>
          <input id="rep-from" type="datetime-local" />
        </div>
        <div>
          <label for="rep-to">По</label>
          <input id="rep-to" type="datetime-local" />
        </div>
        <div style="flex:0">
          <label>&nbsp;</label>
          <button id="btn-report" type="button">Показать</button>
        </div>
      </div>
      <p id="report-msg" class="msg"></p>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Сотрудник</th>
              <th>Задача</th>
              <th>Начало</th>
              <th>Конец</th>
              <th>В периоде</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="report-table"></tbody>
        </table>
      </div>
      <div id="report-totals" class="totals"></div>
    </section>
  </main>

  <div id="edit-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Редактировать запись</h3>
      <input type="hidden" id="edit-id" />
      <label for="edit-desc">Описание</label>
      <textarea id="edit-desc" maxlength="500"></textarea>
      <label for="edit-start">Начало (ISO / datetime-local)</label>
      <input id="edit-start" type="datetime-local" step="1" />
      <label for="edit-end">Конец</label>
      <input id="edit-end" type="datetime-local" step="1" />
      <p id="edit-msg" class="msg"></p>
      <div class="row">
        <button id="btn-edit-save" type="button">Сохранить</button>
        <button id="btn-edit-cancel" type="button" class="secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div id="del-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Удалить сотрудника</h3>
      <p id="del-text" style="color:var(--muted);font-size:0.9rem"></p>
      <input type="hidden" id="del-id" />
      <p id="del-msg" class="msg"></p>
      <div class="row">
        <button id="btn-del-soft" type="button" class="secondary">Без истории (мягко)</button>
        <button id="btn-del-hard" type="button" class="danger">С историей</button>
        <button id="btn-del-cancel" type="button" class="secondary">Отмена</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
